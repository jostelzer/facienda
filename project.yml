name: Facienda
options:
  bundleIdPrefix: org.facienda
  deploymentTarget:
    macOS: '26.0'
  createIntermediateGroups: true
configs:
  Debug: debug
  Release: release
  Tester: release
packages:
  FaciendaPackages:
    path: .
  MCP:
    url: https://github.com/modelcontextprotocol/swift-sdk.git
    exactVersion: 0.12.1
  Textual:
    url: https://github.com/gonzalezreal/textual
    exactVersion: 0.5.0
  WhisperKit:
    url: https://github.com/argmaxinc/WhisperKit
    exactVersion: 1.1.0
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    exactVersion: 2.10.0
settings:
  base:
    SWIFT_VERSION: '6.0'
    SWIFT_STRICT_CONCURRENCY: complete
    MACOSX_DEPLOYMENT_TARGET: '26.0'
    CODE_SIGN_IDENTITY: '-'
    CODE_SIGN_STYLE: Manual
    ENABLE_HARDENED_RUNTIME: YES
    ENABLE_APP_SANDBOX: NO
    GENERATE_INFOPLIST_FILE: YES
  configs:
    # The daily-use build: the app and every helper carry the team's identity and no debugger entitlement.
    # Debug stays ad-hoc signed.
    Release:
      CODE_SIGN_IDENTITY: Apple Development
      DEVELOPMENT_TEAM: 6558TXKC42
      CODE_SIGN_INJECT_BASE_ENTITLEMENTS: NO
    # Builds for testers, outside the App Store: every helper is signed with Developer ID for notarization.
    Tester:
      CODE_SIGN_STYLE: Manual
      CODE_SIGN_IDENTITY: Developer ID Application
      DEVELOPMENT_TEAM: 6558TXKC42
      OTHER_CODE_SIGN_FLAGS: --timestamp
      # Notarization refuses the debugger entitlement that Xcode adds to plain builds.
      CODE_SIGN_INJECT_BASE_ENTITLEMENTS: NO
targets:
  Facienda:
    type: application
    platform: macOS
    sources:
      - Sources/FaciendaApp
      - Assets/Assets.xcassets
      - path: Support/ThirdPartyNotices.txt
        buildPhase: resources
    dependencies:
      - package: FaciendaPackages
        product: FaciendaCore
      - package: FaciendaPackages
        product: FaciendaBridge
      - target: MCPHelper
      - target: HookHelper
      - target: MemoryHelper
      - target: DispatchHelper
      - package: Textual
        product: Textual
      - package: WhisperKit
        product: WhisperKit
      - package: Sparkle
        product: Sparkle
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.facienda.mac
        INFOPLIST_KEY_CFBundleDisplayName: Facienda
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.productivity
        MARKETING_VERSION: 0.3.0
        CURRENT_PROJECT_VERSION: 1
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_KEY_NSPrincipalClass: NSApplication
        INFOPLIST_KEY_NSMicrophoneUsageDescription: Dictate into the top bar. Your speech is turned into text on this Mac.
        # Hardened runtime blocks the microphone without this.
        CODE_SIGN_ENTITLEMENTS: Sources/FaciendaApp/Facienda.entitlements
        # Sparkle's feed and key; only the Tester build sets them, so other builds never look for updates.
        INFOPLIST_FILE: Sources/FaciendaApp/Info.plist
      configs:
        Debug:
          PRODUCT_BUNDLE_IDENTIFIER: org.facienda.mac.development
          INFOPLIST_KEY_CFBundleDisplayName: Facienda Development
        Release:
          CODE_SIGN_STYLE: Automatic
          CODE_SIGN_IDENTITY: Apple Development
          DEVELOPMENT_TEAM: 6558TXKC42
        Tester:
          SPARKLE_FEED_URL: https://github.com/jostelzer/facienda/releases/latest/download/appcast.xml
          # From Sparkle's generate_keys -p; the private key stays in the login keychain.
          SPARKLE_PUBLIC_KEY: qHW6V3VFt4g6DsWI73sEIX2aa/tQmJgHVDaHdZ4Gxls=
    postBuildScripts:
      - name: Bundle command-line helpers
        script: |
          mkdir -p "$TARGET_BUILD_DIR/$CONTENTS_FOLDER_PATH/Helpers"
          # install replaces executables through temporary files/new inodes.
          # In-place cp can invalidate macOS's cached code-signature state.
          /usr/bin/install -m 755 "$BUILT_PRODUCTS_DIR/facienda-mcp" "$TARGET_BUILD_DIR/$CONTENTS_FOLDER_PATH/Helpers/facienda-mcp"
          /usr/bin/install -m 755 "$BUILT_PRODUCTS_DIR/facienda-memory" "$TARGET_BUILD_DIR/$CONTENTS_FOLDER_PATH/Helpers/facienda-memory"
          /usr/bin/install -m 755 "$BUILT_PRODUCTS_DIR/facienda-hook" "$TARGET_BUILD_DIR/$CONTENTS_FOLDER_PATH/Helpers/facienda-hook"
          /usr/bin/install -m 755 "$BUILT_PRODUCTS_DIR/facienda-dispatch" "$TARGET_BUILD_DIR/$CONTENTS_FOLDER_PATH/Helpers/facienda-dispatch"
          # The dispatcher's launch agent, registered by the installed app through SMAppService.
          mkdir -p "$TARGET_BUILD_DIR/$CONTENTS_FOLDER_PATH/Library/LaunchAgents"
          /usr/bin/install -m 644 "$SRCROOT/Support/LaunchAgents/org.facienda.dispatch.plist" "$TARGET_BUILD_DIR/$CONTENTS_FOLDER_PATH/Library/LaunchAgents/org.facienda.dispatch.plist"
        inputFiles:
          - $(BUILT_PRODUCTS_DIR)/facienda-mcp
          - $(BUILT_PRODUCTS_DIR)/facienda-hook
          - $(BUILT_PRODUCTS_DIR)/facienda-memory
          - $(BUILT_PRODUCTS_DIR)/facienda-dispatch
          - $(SRCROOT)/Support/LaunchAgents/org.facienda.dispatch.plist
        outputFiles:
          - $(TARGET_BUILD_DIR)/$(CONTENTS_FOLDER_PATH)/Helpers/facienda-mcp
          - $(TARGET_BUILD_DIR)/$(CONTENTS_FOLDER_PATH)/Helpers/facienda-hook
          - $(TARGET_BUILD_DIR)/$(CONTENTS_FOLDER_PATH)/Helpers/facienda-memory
          - $(TARGET_BUILD_DIR)/$(CONTENTS_FOLDER_PATH)/Helpers/facienda-dispatch
          - $(TARGET_BUILD_DIR)/$(CONTENTS_FOLDER_PATH)/Library/LaunchAgents/org.facienda.dispatch.plist
  MCPHelper:
    type: tool
    platform: macOS
    sources: [Sources/FaciendaMCP]
    dependencies:
      - package: FaciendaPackages
        product: FaciendaCore
      - package: MCP
        product: MCP
    settings:
      base:
        PRODUCT_NAME: facienda-mcp
  HookHelper:
    type: tool
    platform: macOS
    sources: [Sources/FaciendaHook]
    dependencies:
      - package: FaciendaPackages
        product: FaciendaCore
    settings:
      base:
        PRODUCT_NAME: facienda-hook
  MemoryHelper:
    type: tool
    platform: macOS
    sources: [Sources/FaciendaMemory]
    dependencies:
      - package: FaciendaPackages
        product: FaciendaCore
      - package: FaciendaPackages
        product: FaciendaBridge
    settings:
      base:
        PRODUCT_NAME: facienda-memory
  DispatchHelper:
    type: tool
    platform: macOS
    sources: [Sources/FaciendaDispatch]
    dependencies:
      - package: FaciendaPackages
        product: FaciendaCore
      - package: FaciendaPackages
        product: FaciendaBridge
    settings:
      base:
        PRODUCT_NAME: facienda-dispatch
  FaciendaAppTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - Tests/FaciendaAppTests
      - Sources/FaciendaApp/Model
      - Sources/FaciendaApp/Theme.swift
    dependencies:
      - package: FaciendaPackages
        product: FaciendaCore
      - package: FaciendaPackages
        product: FaciendaBridge
  FaciendaCoreTests:
    type: bundle.unit-test
    platform: macOS
    sources: [Tests/FaciendaCoreTests]
    dependencies:
      - package: FaciendaPackages
        product: FaciendaCore
schemes:
  Facienda:
    build:
      targets:
        Facienda: all
        FaciendaCoreTests: [test]
        FaciendaAppTests: [test]
    test:
      targets: [FaciendaCoreTests, FaciendaAppTests]
